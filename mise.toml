# hapi-factory toolchain and tasks.
#
# mise is the only host prerequisite besides Docker: `mise install` gets every
# tool below at the pinned version, and `mise tasks` lists the tasks.
#
# Pinning rule (spec §3, §11.6): every tool is an exact version. Never `latest`,
# never a range. To upgrade, bump the version here, run
# `mise install && mise run lint && mise run test`, and say why in the PR.
#
# This file is a protected path (spec §8.2): an interactive agent session must
# ask the operator before editing it, and unattended sessions and workers may not
# edit it at all (interactive: ask, unattended: deny, workers: deny).

min_version = "2026.10.3"

[tools]
bun = "1.4.4"                         # runtime, package manager and test runner for the hapi CLI
node = "24.22.1"                      # LTS line; for Node-based tools (e.g. a standalone Pi CLI later)
uv = "0.13.5"                         # Python package manager (Hermes-side tooling)
python = "3.14.9"                     # the 3.14 line, which Hermes runs
gh = "2.103.2"                        # GitHub CLI, for the operator's manual setup steps only; factory code uses src/forge/
gitleaks = "8.30.1"                   # secret scanner
sops = "3.13.3"                       # the default secret provider: one age-encrypted file (spec §11.5, docs/secrets.md)
age = "1.3.2"                         # provides `age` and `age-keygen`: the key sops encrypts to

# ---------------------------------------------------------------------------
# Tasks. Stubs exit 1 with a message naming the plan task that implements
# them, so a stub can never pass as a real check.
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Install the pinned JS dependencies from bun.lock (frozen; fails if the lockfile is out of date)"
run = "bun install --frozen-lockfile"

[tasks.test]
description = "Run the unit test suite (no Docker, network or secrets needed)"
run = "bun test"

[tasks."test:int"]
description = "Run every integration test (*.int.test.ts: the stack's egress boundary on real Docker and Squid, the real sops + age lifecycle) with HAPI_INT=1; needs Docker, and the internet for some (docs/runbooks/stack.md)"
env = { HAPI_INT = "1" }
run = "bun test --timeout 1200000 .int.test.ts"

[tasks.lint]
description = "Type-check the project with tsc (strict, no emit)"
depends = ["setup"]
run = "bunx tsc --noEmit"

[tasks.hapi]
description = "Run the hapi CLI, e.g. `mise run hapi -- --help`"
run = "bun run src/cli.ts"

[tasks."secrets:init"]
description = "Set up the default sops + age secrets store: this machine's age key, a recovery key locked with 10 words (shown once, two typed back), an encrypted file of every name in stack/secrets.yaml (empty) for both keys, its recipients file, recovery.age and the config (never overwrites; e.g. `mise run secrets:init -- --file private/secrets.enc.yaml`)"
run = "bun run src/cli.ts secrets init"

[tasks."secrets:edit"]
description = "Edit your sops secrets store in $EDITOR (`sops edit`; the plaintext temp file stays on your tmpfs)"
run = "bun run src/cli.ts secrets edit"

[tasks."secrets:check"]
description = "List every secret in stack/secrets.yaml as found, missing or empty in your store, never a value, and the store's recipients; exits 1 unless all are found, or on recipient drift, a post-quantum/classic mix, a non-age key or a recovery.age that doesn't match its recorded SHA-256; warns if there is no recovery key or recovery.age"
run = "bun run src/cli.ts secrets check"

[tasks."secrets:drill"]
description = "Prove your 10 recovery words and recovery.age open the store, in an isolated temp dir; prints a count, never a value (docs/secrets.md#keys-and-recovery)"
run = "bun run src/cli.ts secrets drill"

[tasks."secrets:join"]
description = "On a new machine or user: make its own age key and config for a copy of the store, and print the add-machine command (e.g. `mise run secrets:join -- --store private/secrets.enc.yaml`)"
run = "bun run src/cli.ts secrets join"

[tasks."secrets:add-machine"]
description = "Add a machine's public key to the store with a new data key, and to its recipients file (`mise run secrets:add-machine -- --name <n> --recipient <age1...>`)"
run = "bun run src/cli.ts secrets add-machine"

[tasks."secrets:recover"]
description = "With the store, recovery.age, the recipients file and your 10 words: give this machine its own key to the store (`mise run secrets:recover -- --store <file>`)"
run = "bun run src/cli.ts secrets recover"

[tasks."secrets:revoke"]
description = "Remove a recipient from the store with a new data key, and from its recipients file (`mise run secrets:revoke -- --name <n>`)"
run = "bun run src/cli.ts secrets revoke"

[tasks."secrets:new-recovery"]
description = "Replace the recovery key and its 10 words, when they are lost or exposed; needs a working machine key"
run = "bun run src/cli.ts secrets new-recovery"

[tasks."policy:build"]
description = "Compile policy/ into the Hermes, Archon, Pi, egress and MCP configs under build/ (e.g. `mise run policy:build -- --roster budget`)"
run = "bun run src/cli.ts policy build"

[tasks.audit]
description = "Check the deployed config, pins, running stack, secrets setup and each --repo's GitHub settings against policy; exits 1 on any fail, and `--strict` fails every skip too (e.g. `mise run audit -- --strict --repo <owner>/<name>`, as hapi; docs/audit.md)"
run = "bun run src/cli.ts audit"

[tasks.up]
description = "Build policy, resolve secrets, then start the stack and wait until it is healthy, as the hapi user (re-execs with sudo -u hapi -H; HAPI_ALLOW_CURRENT_USER=1 is a dev-only bypass). Flags after --, e.g. `mise run up -- --roster budget` (docs/runbooks/stack.md)"
run = "bun run src/cli.ts stack up"

[tasks.down]
description = "Stop the stack and remove its containers and networks, keeping its volumes, as the hapi user: kill switch 3 (docs/runbooks/stack.md)"
run = "bun run src/cli.ts stack down"
