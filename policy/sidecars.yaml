# yaml-language-server: $schema=schemas/policy-sidecars.schema.json
#
# The central list of sidecars (Plan 03, design §3.3). A repo's overlay names
# one of these and a data dir; it can't bring its own image or command. The run
# engine starts the sidecar from the pinned image, with the repo's data dir
# mounted at /data, and the run reaches it by its name on port.
sidecars:
  bun-http:
    image: oven/bun:1.4.4-slim@sha256:1846adf22496bd711036aae8be147e57bdebbaea2e5264e3e0b5af1db187d9a4
    command: ["bun", "/data/server.ts"]   # server.ts must use Bun's default host, so the run reaches it by its alias
    port: 8080
