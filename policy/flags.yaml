# yaml-language-server: $schema=schemas/policy-flags.schema.json
#
# Flags and thresholds, as spec §13.3 but for coderabbit.enabled (see its
# comment). A flagged run gets hapi:flagged on its PR and an alert in
# #hapi-alerts.
metrics:      { enabled: true, merge_outcomes: true }
otel:         { enabled: false, content_capture: off }   # off | preview
jev:          { enabled: true, fallback: haiku, via: openrouter }  # fallback: haiku | none
# coderabbit.enabled is the round on an open PR (CodeRabbit's own PR review), not its CLI in the review run
# (runs.phases.coderabbit). Off: CodeRabbit skips a PR an App opened unless the App's bot holds a seat (H-312).
coderabbit:   { enabled: false, include_in_rework: true }
thresholds:                                              # crossing one flags the run
  run_usd: 3.00
  interventions: 1
  review_rounds: 2
on_flag: [label_pr, chat_alert]          # chat_alert posts to Slack #hapi-alerts
