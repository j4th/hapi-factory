# yaml-language-server: $schema=schemas/policy-protected-paths.schema.json
#
# Protected paths, per mode (spec §8.2). Globs are relative to a repo's root.
#
#   interactive  the operator is in the session (Hermes, or later a direct-lane Pi
#                session). ask = put the diff in front of him to approve.
#   unattended   Hermes cron, webhook and API surfaces. Always deny.
#   workers      Pi or Claude Code inside Archon. Always deny.
#
# Modes tighten in the order allow < ask < deny. A repo's .factory/config.yaml
# may add paths or tighten modes here, never loosen or remove them.
#
# How globs combine (binding on every guard and generator): a file's mode, per
# session kind, is the STRICTEST mode across EVERY glob that matches it. Never
# the first, last or most specific match, so no glob can loosen another. A file
# no glob matches is allow. Use effectiveModes() in src/policy/paths.ts.
#
# Glob syntax: anchored at the repo root ("AGENTS.md" is the root file only);
# "**" as a whole segment matches zero or more segments ("dir/**" covers dir
# itself too); "*" and "?" stay within one segment; everything else is literal.
# Backstop: CODEOWNERS plus the main ruleset, so a guard failing locally still
# can't land a change.
protected_paths:
  # Agent instruction files, at any depth: every agent that runs in a repo, and
  # CodeRabbit, reads them as instructions, so a write persists into later
  # sessions. "**/" matches the root too.
  "**/AGENTS.md":       { interactive: ask, unattended: deny, workers: deny }
  "**/AGENT.md":        { interactive: ask, unattended: deny, workers: deny }
  "**/CLAUDE.md":       { interactive: ask, unattended: deny, workers: deny }
  "**/CLAUDE.local.md": { interactive: ask, unattended: deny, workers: deny }
  "**/GEMINI.md":       { interactive: ask, unattended: deny, workers: deny }
  "**/REVIEW.md":       { interactive: ask, unattended: deny, workers: deny }
  "**/.cursorrules":    { interactive: ask, unattended: deny, workers: deny }
  "**/.windsurfrules":  { interactive: ask, unattended: deny, workers: deny }
  "**/.claude/**":      { interactive: ask, unattended: deny, workers: deny }
  "**/.cursor/**":      { interactive: ask, unattended: deny, workers: deny }
  "**/.clinerules/**":  { interactive: ask, unattended: deny, workers: deny }
  "**/.rules/**":       { interactive: ask, unattended: deny, workers: deny }
  ".factory/**": { interactive: ask, unattended: deny, workers: deny }
  ".github/**":  { interactive: ask, unattended: deny, workers: deny }
  "mise.toml":   { interactive: ask, unattended: deny, workers: deny }
  ".pi/**":      { interactive: deny, unattended: deny, workers: deny }
  ".agents/**":  { interactive: ask, unattended: deny, workers: deny }
  ".archon/**":  { interactive: deny, unattended: deny, workers: deny }
  ".coderabbit.yaml":      { interactive: ask, unattended: deny, workers: deny }
  ".coderabbit.yml":       { interactive: ask, unattended: deny, workers: deny }
  ".coderabbit.config.ts": { interactive: ask, unattended: deny, workers: deny }
