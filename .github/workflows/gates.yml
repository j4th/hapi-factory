# The factory's gates for a target repo (spec §11.7; design §3.3): the reusable workflow every repo made from
# templates/repo-contract calls from its .github/workflows/hapi-gates.yml, pinned to one hapi-factory commit:
#
#   jobs:
#     ci:
#       permissions:
#         contents: read
#       uses: <owner>/hapi-factory/.github/workflows/gates.yml@<40-hex commit>
#
# Three jobs. The caller's job is `ci`, so GitHub reports them as `ci / scan`, `ci / check` and `ci / gates`, and the
# repo's main-protect requires only `ci / gates` (CONTRACT_CHECK in src/forge/index.ts), from GitHub Actions:
#
# - `scan` runs no PR code. It ignores the PR's scanner configs, its .gitattributes (GIT_ATTR_SOURCE, the empty
#   tree, and `* diff` in .git/info/attributes), its .mailmap and its .gitmodules. On its own fresh runner and
#   checkout, with no mise, it runs the mise-file scan, refuses a PR's gitleaks files, installs gitleaks, OSV-Scanner
#   and zizmor from release URLs whose sha256 is pinned below (the same versions as the template's mise.toml), and
#   runs them, and the factory-commit trailer check (H-113's factory half), by absolute path under `env -i` with
#   GIT_NO_REPLACE_OBJECTS=1, each with the gates' own config. The history scan needs git 2.40 or later. It first
#   runs, itself, the `git log` gitleaks will run (every fetched ref, merges' diffs with `-m`, type changes, no
#   rename detection, no .mailmap, submodule config not read, no system git config), and fails on a non-zero exit
#   or any byte on stderr; then gitleaks, which fails the step on a finding, on any ERR line, on any WRN line but its
#   findings count, or on a scan of 0 commits. Known residual: gitleaks's default path allowlist (H-240). A PR's
#   code runs only in `check`, on another runner.
# - `check` runs the caller's own `mise install --locked && mise run check` (its `setup` installs with
#   `--ignore-scripts`), after ci.yml's two mise steps.
# - `gates` passes only when both succeeded. It runs even when one failed (`if: always()`): GitHub reports a job
#   skipped because a needed job failed as a success, which would turn the required check green.
#
# Least privilege: `permissions: {}` here and on `gates`, `contents: read` on `scan` and `check`, which the caller
# grants; no secret is used (zizmor's online audits get the job's read-only token); checkout doesn't keep the token
# in .git/config. Every action is pinned to a full commit SHA, the tag it was resolved from in a comment (spec
# §11.7). The mise steps are ci.yml's, word for word (tests/scripts/gates-workflow.test.ts holds them so): a mise
# file besides the root mise.toml and mise.lock could change what a later step runs (H-194).
name: gates

on:
  workflow_call: {}

permissions: {}

# `bash --noprofile --norc -eo pipefail {0}`: without a shell named, Actions runs `bash -e {0}`, with no pipefail.
defaults:
  run:
    shell: bash

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Each scanner's linux-x64 release and its sha256, from the project's own checksums file (gitleaks'
      # gitleaks_8.30.1_checksums.txt, OSV-Scanner's osv-scanner_SHA256SUMS) or, for zizmor, which publishes none,
      # GitHub's release-asset digest (the asset carries GitHub artifact attestations). Versions as the template's
      # mise.toml pins them.
      GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      OSV_SCANNER_URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
      ZIZMOR_URL: https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
      ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the whole history, for the gitleaks scan and the trailer check

      # mise reads config, tasks and locked tools from more files than mise.toml (.mise.toml,
      # mise.local.toml, mise.<env>.toml, .config/mise.toml, mise/ and .mise/, mise-tasks/,
      # .tool-versions, mise.<env>.lock, ...), and a later file overrides mise.toml. mise-action installs
      # the tools they name and exports the env they set to every later step, so a commit that adds
      # one could change what this job runs, a check after it included. So this is a plain file
      # scan, before mise-action, for the names policy/protected_paths.yaml protects, at any depth
      # and in any case. Only the root mise.toml may configure mise here, and only the root
      # mise.lock, which locks the tools it names (H-116), may sit beside it.
      - name: Only the root mise.toml configures mise
        run: |
          extra="$(find . -path ./.git -prune -o \( -iname mise.toml -o -iname .mise.toml -o -iname 'mise.*.toml' -o -iname '.mise.*.toml' \
            -o -iname mise.lock -o -iname 'mise.*.lock' -o -iname mise -o -iname .mise -o -iname mise-tasks -o -iname .mise-tasks \
            -o -iname .tool-versions \) ! -path ./mise.toml ! -path ./mise.lock -print -prune)"
          if [[ -n "$extra" ]]; then
            echo "::error::mise files besides the root mise.toml and mise.lock. Move what is needed into mise.toml and remove:"
            printf '%s\n' "$extra"
            exit 1
          fi

      # gitleaks reads the history through `git log -p`, which honours the checkout's .gitattributes: a PR that
      # commits `* -diff` or `* binary` (at the root, or in any directory over the files below it), or a file with a
      # NUL byte, turns its diffs into "Binary files differ", and gitleaks never sees them. .git/info/attributes
      # outranks every .gitattributes, and `diff` set on a path makes git diff it as text, NUL bytes and all. So
      # every path is scanned as text, and a real binary that looks like a secret fails the scan, closed, unless it
      # sits in a path gitleaks's default allowlist skips (*.png, *.pdf, node_modules/, package-lock.json, ...:
      # H-240). The dry run's git and gitleaks's also read no in-tree .gitattributes at all (GIT_ATTR_SOURCE); this
      # stays as a second net.
      - name: Git diffs every path as text, whatever the PR's .gitattributes say
        run: |
          mkdir -p .git/info
          printf '* diff\n' > .git/info/attributes

      # The scanners' configs are the gates' own. gitleaks gets an explicit --config (its default rules), and
      # always reads a root .gitleaksignore whatever --gitleaks-ignore-path says (checked with 8.30.1), so a root
      # .gitleaks.toml or .gitleaksignore, either of which could allowlist a PR's own secret, is refused. OSV-Scanner
      # gets an empty --config, which replaces any osv-scanner.toml it would find. zizmor runs with --no-config
      # --no-ignores. Under env -i, no GITLEAKS_CONFIG, GITLEAKS_CONFIG_TOML or ZIZMOR_CONFIG reaches a scanner. A
      # symlink counts even when it dangles: gitleaks could follow it once the target exists.
      - name: The scanners' configs are the gates' own
        run: |
          if [[ -e .gitleaks.toml || -L .gitleaks.toml || -e .gitleaksignore || -L .gitleaksignore ]]; then
            echo "::error::a root .gitleaks.toml or .gitleaksignore would change what gitleaks finds. Remove it; the gates scan with gitleaks's own rules."
            exit 1
          fi
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          : > "$RUNNER_TEMP/osv-scanner.toml"

      # Each download is checked against the sha256 above before anything is unpacked or run; a mismatch fails the
      # step. Nothing here reads the checkout: the files go to $RUNNER_TEMP.
      - name: Install the scanners, each checked against its pinned sha256
        run: |
          cd "$RUNNER_TEMP" || exit 1
          mkdir -p bin dl
          fetch() {
            curl -fsSL --proto '=https' --tlsv1.2 --retry 3 -o "dl/$3" "$1"
            printf '%s  %s\n' "$2" "dl/$3" | sha256sum -c --strict -
          }
          fetch "$GITLEAKS_URL" "$GITLEAKS_SHA256" gitleaks.tar.gz
          fetch "$OSV_SCANNER_URL" "$OSV_SCANNER_SHA256" osv-scanner
          fetch "$ZIZMOR_URL" "$ZIZMOR_SHA256" zizmor.tar.gz
          tar -xzf dl/gitleaks.tar.gz -C bin gitleaks
          install -m 0755 dl/osv-scanner bin/osv-scanner
          tar -xzf dl/zizmor.tar.gz -C bin zizmor
          chmod 0755 bin/gitleaks bin/zizmor

      # The whole history, not just the diff: a secret in any commit stays public even after a later
      # commit removes it. Inline gitleaks:allow comments are ignored.
      # GIT_ATTR_SOURCE (below) is honoured from git 2.40 and silently ignored before it.
      - name: git is 2.40 or later
        run: |
          v="$(env -i PATH=/usr/bin:/bin /usr/bin/git --version)"
          major=0
          minor=0
          if [[ "$v" =~ ^git\ version\ ([0-9]+)\.([0-9]+) ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
          fi
          if (( 10#$major < 2 || (10#$major == 2 && 10#$minor < 40) )); then
            echo "::error::the history scan needs git 2.40 or later, which honours GIT_ATTR_SOURCE; /usr/bin/git says: $v"
            exit 1
          fi
          echo "$v"

      # gitleaks 8.30.1 ignores git's exit status, and logs a git stderr line as a WRN, not an ERR, when it contains
      # one of git's renameLimit, skipped-rename-detection or auto-gc messages. A PR can make git die quoting its
      # own text (a .gitmodules value git can't parse as a boolean, read while git diffs a gitlink), so gitleaks
      # scans what came before and passes. So the scan first runs, itself, exactly the git command gitleaks runs
      # (captured from gitleaks: `git -C . log -p -U0` and the --log-opts words, git found on PATH as /usr/bin/git),
      # in the same environment, and fails on a non-zero exit or any byte on stderr. tests/scripts/gates-workflow.test.ts
      # holds this argv and environment equal to the real gitleaks's. Its stdout, the patches, is discarded.
      # The log options, the same in both steps:
      # - --full-history --all: every commit on every fetched ref. -m: a merge's own diff against each parent, so an
      #   evil merge (a token in neither parent) is seen; `log -p` shows none without it. Naming them replaces
      #   gitleaks's default `--diff-filter=tuxdb`, which skips type changes (a symlink or a gitlink later turned
      #   into a file holding a token).
      # - --no-mailmap: no .mailmap. --no-renames: a moved file is a deletion and an addition, so a token first
      #   committed in a path gitleaks's allowlist skips (node_modules/, *.png, package-lock.json: H-240) and then
      #   moved anywhere else is scanned in full there; with rename detection only the edited lines would be.
      # - --ignore-submodules=none: git never reads .gitmodules for a gitlink's settings. --no-ext-diff
      #   --no-textconv: no external diff or textconv driver (both need git config a PR can't write; hardening).
      # GIT_ATTR_SOURCE, git's empty tree, makes git read no .gitattributes from the checkout (.git/info/attributes
      # still applies), and GIT_CONFIG_NOSYSTEM=1 no /etc/gitconfig, whose settings (log.diffMerges, say) could change
      # what these options mean.
      # git's stderr can quote a PR's text, so each line is shown behind a `git: ` prefix, never at the start of a
      # line, where Actions would read it as a workflow command.
      - name: git log runs clean, exactly as gitleaks will run it
        run: |
          err="$RUNNER_TEMP/git-log.err"
          code=0
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" GIT_NO_REPLACE_OBJECTS=1 GIT_ATTR_SOURCE=4b825dc642cb6eb9a060e54bf8d69288fbee4904 GIT_CONFIG_NOSYSTEM=1 \
            /usr/bin/git -C . log -p -U0 --full-history --all -m --no-mailmap --no-renames --ignore-submodules=none --no-ext-diff --no-textconv \
            > /dev/null 2> "$err" || code=$?
          if [[ "$code" != 0 || -s "$err" ]]; then
            head -n 20 "$err" | sed 's/^/git: /'
            echo "::error::git log, run as gitleaks runs it, exited $code or wrote to stderr, and gitleaks 8.30.1 would scan on regardless: the history scan fails closed"
            exit 1
          fi

      # gitleaks, with the log options above, in the same environment. It fails open on git's stderr: on any line
      # (a PR's .gitattributes with a nested macro, a negative pattern or a line over 2048 bytes, a symlinked
      # .gitattributes or .mailmap, before GIT_ATTR_SOURCE and --no-mailmap) it logs an ERR, reports the commits it
      # got through (0 or more) and exits 0, and git's renameLimit, rename-detection and auto-gc lines it logs as a
      # WRN. So any ERR line, any WRN line but its own `leaks found: N`, or "0 commits scanned" fails the step; a
      # clean scan logs none of them. Inline gitleaks:allow comments are ignored. A finding (exit 1) fails the step.
      - name: Scan the whole history for secrets (gitleaks)
        run: |
          log="$RUNNER_TEMP/gitleaks.log"
          code=0
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" GIT_NO_REPLACE_OBJECTS=1 GIT_ATTR_SOURCE=4b825dc642cb6eb9a060e54bf8d69288fbee4904 GIT_CONFIG_NOSYSTEM=1 \
            "$RUNNER_TEMP/bin/gitleaks" git --config "$RUNNER_TEMP/gitleaks.toml" \
            --log-opts="--full-history --all -m --no-mailmap --no-renames --ignore-submodules=none --no-ext-diff --no-textconv" \
            --ignore-gitleaks-allow --redact --no-banner --no-color -v . 2>&1 | tee "$log" || code=$?
          if grep -Eq '(^|[[:space:]])ERR([[:space:]]|$)' "$log"; then
            echo "::error::gitleaks logged an error, so its scan can't be trusted: the history scan fails closed"
            exit 1
          fi
          # No grep -q in this pipe: under pipefail, its early exit could kill the grep before it (SIGPIPE), and the
          # pipeline's non-zero status would read as "no warning".
          warned="$(grep -E '(^|[[:space:]])WRN([[:space:]]|$)' "$log" | grep -Ev '^[^[:space:]]+ WRN leaks found: [0-9]+$' || true)"
          if [[ -n "$warned" ]]; then
            echo "::error::gitleaks logged a warning other than its findings count (it logs some of git's errors as warnings), so its scan can't be trusted: the history scan fails closed"
            exit 1
          fi
          if grep -Eq '(^|[[:space:]])0 commits scanned' "$log"; then
            echo "::error::gitleaks scanned 0 commits: the history scan fails closed"
            exit 1
          fi
          exit "$code"

      - name: Known vulnerabilities in bun.lock (OSV-Scanner)
        run: |
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" GIT_NO_REPLACE_OBJECTS=1 \
            "$RUNNER_TEMP/bin/osv-scanner" scan source --config "$RUNNER_TEMP/osv-scanner.toml" --lockfile bun.lock

      # Online, so the impostor-commit and ref-confusion audits run: zizmor needs only a token with contents: read
      # (zizmor's docs), the job's own, passed by name.
      - name: Workflow security (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" GIT_NO_REPLACE_OBJECTS=1 GH_TOKEN="$GH_TOKEN" \
            "$RUNNER_TEMP/bin/zizmor" --no-config --no-ignores --format=github .github/workflows

      # A factory PR's every commit carries the run's trailers (spec §13.2), so a commit on a
      # factory/** branch that no run made, such as one another App or a reviewer pushed, is caught
      # before merge (H-113). Other branches pass: plan/** is H-237. git runs by absolute path in a
      # clean environment, as the scanners do.
      - name: Factory commits carry their trailers
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$HEAD_REF" in
            factory/*) ;;
            *) echo "not a factory/** branch: no trailer check"; exit 0 ;;
          esac
          git() { env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" GIT_NO_REPLACE_OBJECTS=1 /usr/bin/git "$@"; }
          shas="$(git rev-list "$BASE_SHA..$HEAD_SHA")"
          missing=0
          for sha in $shas; do
            trailers="$(git log -1 --format='%(trailers:only,unfold)' "$sha")"
            for key in Work-Order Hapi-Run Trace-Id Agent Model; do
              if ! grep -Eq "^${key}: *[^[:space:]]" <<< "$trailers"; then
                echo "::error::$sha has no $key trailer"
                missing=1
              fi
            done
            if ! grep -Fxq 'Hapi-Lane: factory' <<< "$trailers"; then
              echo "::error::$sha has no Hapi-Lane: factory trailer"
              missing=1
            fi
          done
          exit "$missing"

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise reads config, tasks and locked tools from more files than mise.toml (.mise.toml,
      # mise.local.toml, mise.<env>.toml, .config/mise.toml, mise/ and .mise/, mise-tasks/,
      # .tool-versions, mise.<env>.lock, ...), and a later file overrides mise.toml. mise-action installs
      # the tools they name and exports the env they set to every later step, so a commit that adds
      # one could change what this job runs, a check after it included. So this is a plain file
      # scan, before mise-action, for the names policy/protected_paths.yaml protects, at any depth
      # and in any case. Only the root mise.toml may configure mise here, and only the root
      # mise.lock, which locks the tools it names (H-116), may sit beside it.
      - name: Only the root mise.toml configures mise
        run: |
          extra="$(find . -path ./.git -prune -o \( -iname mise.toml -o -iname .mise.toml -o -iname 'mise.*.toml' -o -iname '.mise.*.toml' \
            -o -iname mise.lock -o -iname 'mise.*.lock' -o -iname mise -o -iname .mise -o -iname mise-tasks -o -iname .mise-tasks \
            -o -iname .tool-versions \) ! -path ./mise.toml ! -path ./mise.lock -print -prune)"
          if [[ -n "$extra" ]]; then
            echo "::error::mise files besides the root mise.toml and mise.lock. Move what is needed into mise.toml and remove:"
            printf '%s\n' "$extra"
            exit 1
          fi

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.9

      # A second net, for a file the scan doesn't know by name (a newer mise's): ask mise what it
      # loaded. It runs after mise-action has loaded it, so the scan above is the gate.
      - name: mise loads no config or tasks but the root mise.toml
        run: |
          configs="$(mise config ls --json)"
          tasks="$(mise tasks ls --json --hidden)"
          extra="$(jq -rn --arg root "$PWD/" --argjson configs "$configs" --argjson tasks "$tasks" \
            '[$configs[].path, $tasks[].source] | unique[] | select(type == "string" and startswith($root) and . != $root + "mise.toml")')"
          if [[ -n "$extra" ]]; then
            echo "::error::mise config or tasks outside the root mise.toml. Move what is needed into mise.toml and remove:"
            printf '%s\n' "$extra"
            exit 1
          fi

      # `--locked`: a tool the caller's mise.lock doesn't cover fails here instead of resolving a version.
      # `check` is the caller's lint and test; both run its `setup` first (bun ci --frozen-lockfile
      # --ignore-scripts), so a stale bun.lock fails here and no install script ever runs.
      - name: check
        run: mise install --locked && mise run check

  gates:
    name: gates
    needs: [scan, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: scan and check both succeeded
        env:
          SCAN: ${{ needs.scan.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          echo "scan: $SCAN, check: $CHECK"
          if [[ "$SCAN" != success || "$CHECK" != success ]]; then
            echo "::error::ci / gates needs both ci / scan and ci / check to succeed (scan: $SCAN, check: $CHECK)"
            exit 1
          fi
