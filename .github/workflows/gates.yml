# The factory's gates for a target repo (spec §11.7; design §3.3): the reusable workflow every repo made from
# templates/repo-contract calls from its .github/workflows/hapi-gates.yml, pinned to one hapi-factory commit:
#
#   jobs:
#     ci:
#       permissions:
#         contents: read
#       uses: <owner>/hapi-factory/.github/workflows/gates.yml@<40-hex commit>
#
# The caller's job is `ci` and this one is `gates`, so the check GitHub reports is `ci / gates`
# (CONTRACT_CHECK in src/forge/index.ts), which the repo's main-protect requires, from GitHub Actions.
#
# - It runs the caller's own `mise run check` (its `setup` installs with `--ignore-scripts`), gitleaks over the
#   whole history, OSV-Scanner over bun.lock (GitHub's dependency graph doesn't read it), zizmor over the caller's
#   workflows, and, on a pull request from a factory/** branch, the commit-trailer check (H-113's factory half).
# - Least privilege: `permissions: {}` here and `contents: read` on the job, which the caller grants; no secret is
#   used; checkout doesn't keep the token in .git/config. Every action is pinned to a full commit SHA, the tag it was
#   resolved from in a comment (spec §11.7). mise is the version the template's mise.toml names as `min_version`, and
#   it installs each tool from the caller's mise.lock (--locked).
# - The two mise steps are ci.yml's, word for word (tests/scripts/gates-workflow.test.ts holds them so): a mise file
#   besides the root mise.toml and mise.lock could change what every later step runs (H-194).
name: gates

on:
  workflow_call: {}

permissions: {}

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the whole history, for the gitleaks scan and the trailer check

      # mise reads config, tasks and locked tools from more files than mise.toml (.mise.toml,
      # mise.local.toml, mise.<env>.toml, .config/mise.toml, mise/ and .mise/, mise-tasks/,
      # .tool-versions, mise.<env>.lock, ...), and a later file overrides mise.toml. mise-action installs
      # the tools they name and exports the env they set to every later step, so a commit that adds
      # one could change what this job runs, a check after it included. So this is a plain file
      # scan, before mise-action, for the names policy/protected_paths.yaml protects, at any depth
      # and in any case. Only the root mise.toml may configure mise here, and only the root
      # mise.lock, which locks the tools it names (H-116), may sit beside it.
      - name: Only the root mise.toml configures mise
        run: |
          extra="$(find . -path ./.git -prune -o \( -iname mise.toml -o -iname .mise.toml -o -iname 'mise.*.toml' -o -iname '.mise.*.toml' \
            -o -iname mise.lock -o -iname 'mise.*.lock' -o -iname mise -o -iname .mise -o -iname mise-tasks -o -iname .mise-tasks \
            -o -iname .tool-versions \) ! -path ./mise.toml ! -path ./mise.lock -print -prune)"
          if [[ -n "$extra" ]]; then
            echo "::error::mise files besides the root mise.toml and mise.lock. Move what is needed into mise.toml and remove:"
            printf '%s\n' "$extra"
            exit 1
          fi

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.9

      # A second net, for a file the scan doesn't know by name (a newer mise's): ask mise what it
      # loaded. It runs after mise-action has loaded it, so the scan above is the gate.
      - name: mise loads no config or tasks but the root mise.toml
        run: |
          configs="$(mise config ls --json)"
          tasks="$(mise tasks ls --json --hidden)"
          extra="$(jq -rn --arg root "$PWD/" --argjson configs "$configs" --argjson tasks "$tasks" \
            '[$configs[].path, $tasks[].source] | unique[] | select(type == "string" and startswith($root) and . != $root + "mise.toml")')"
          if [[ -n "$extra" ]]; then
            echo "::error::mise config or tasks outside the root mise.toml. Move what is needed into mise.toml and remove:"
            printf '%s\n' "$extra"
            exit 1
          fi

      # `--locked`: a tool the caller's mise.lock doesn't cover fails here instead of resolving a version.
      # `check` is the caller's lint and test; both run its `setup` first (bun ci --frozen-lockfile
      # --ignore-scripts), so a stale bun.lock fails here and no install script ever runs.
      - name: check
        run: mise install --locked && mise run check

      # The whole history, not just the diff: a secret in any commit stays public even after a later
      # commit removes it. gitleaks reads a root .gitleaks.toml (its config) and a root .gitleaksignore,
      # and either could allowlist a PR's own secret, so the step refuses both: the caller's
      # protected_paths already keep workers off them, and a false positive is fixed in the code, not
      # here. Inline gitleaks:allow comments are ignored.
      - name: Scan the whole history for secrets (gitleaks)
        run: |
          if [[ -e .gitleaks.toml || -e .gitleaksignore ]]; then
            echo "::error::a root .gitleaks.toml or .gitleaksignore would change what gitleaks finds. Remove it; the gates scan with gitleaks's own rules."
            exit 1
          fi
          mise exec -- gitleaks git --ignore-gitleaks-allow --redact --no-banner --no-color -v .

      - name: Known vulnerabilities in bun.lock (OSV-Scanner)
        run: mise exec -- osv-scanner scan source --lockfile bun.lock

      - name: Workflow security (zizmor)
        run: mise exec -- zizmor --offline --format=github .github/workflows

      # A factory PR's every commit carries the run's trailers (spec §13.2), so a commit on a
      # factory/** branch that no run made, such as one another App or a reviewer pushed, is caught
      # before merge (H-113). Other branches pass: plan/** is H-113's other half.
      - name: Factory commits carry their trailers
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$HEAD_REF" in
            factory/*) ;;
            *) echo "not a factory/** branch: no trailer check"; exit 0 ;;
          esac
          shas="$(git rev-list "$BASE_SHA..$HEAD_SHA")"
          missing=0
          for sha in $shas; do
            trailers="$(git log -1 --format='%(trailers:only,unfold)' "$sha")"
            for key in Work-Order Hapi-Run Trace-Id Agent Model; do
              if ! grep -Eq "^${key}: *[^[:space:]]" <<< "$trailers"; then
                echo "::error::$sha has no $key trailer"
                missing=1
              fi
            done
            if ! grep -Fxq 'Hapi-Lane: factory' <<< "$trailers"; then
              echo "::error::$sha has no Hapi-Lane: factory trailer"
              missing=1
            fi
          done
          exit "$missing"
