# CI for hapi-factory itself: install the pinned toolchain, type-check, run the unit tests, and
# scan the whole history for secrets.
#
# - The job is named `ci`. The `main-protect` ruleset requires a passing `ci` check and has no
#   bypass actors, so nobody can merge with `ci` red or missing (see README, "Manual setup steps").
# - Every action is pinned to a full commit SHA (spec §11.7). The comment after each SHA is the
#   release tag it was resolved from (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`).
# - Least privilege: the token can only read the repo, and checkout doesn't keep it in .git/config.
# - mise itself is pinned to the version in mise.toml's `min_version`; mise then installs the
#   exact tool versions from mise.toml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel a superseded run only on a PR; on main every merge keeps its own result (H-060).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the whole history, for the gitleaks scan

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.9

      # mise reads config and tasks from more files than mise.toml (.mise.toml, mise.local.toml,
      # .config/mise.toml, mise/config.toml, .tool-versions, mise-tasks/, ...), and a later file
      # overrides mise.toml, so a commit that adds one could change what the next step runs. Only
      # the root mise.toml may configure mise here (policy/protected_paths.yaml protects the rest).
      - name: Only the root mise.toml configures mise
        run: |
          configs="$(mise config ls --json)"
          tasks="$(mise tasks ls --json --hidden)"
          extra="$(jq -rn --arg root "$PWD/" --argjson configs "$configs" --argjson tasks "$tasks" \
            '[$configs[].path, $tasks[].source] | unique[] | select(type == "string" and startswith($root) and . != $root + "mise.toml")')"
          if [[ -n "$extra" ]]; then
            echo "::error::mise config or tasks outside the root mise.toml. Move what is needed into mise.toml and remove:"
            printf '%s\n' "$extra"
            exit 1
          fi

      # `mise run lint` first runs `setup` (bun install --frozen-lockfile), so a stale bun.lock fails here.
      - name: Install tools, type-check, unit tests
        run: mise install && mise run lint && mise run test

      # The whole history, not just the diff: a secret in any commit stays public
      # even after a later commit removes it (H-057).
      - name: Scan the whole history for secrets (gitleaks)
        run: mise exec -- gitleaks git --redact --no-banner --no-color -v .
