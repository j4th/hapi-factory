# yaml-language-server: $schema=../policy/schemas/secrets-map.schema.json
#
# The secrets map (spec §11.5): which Bitwarden Secrets Manager secret fills
# which env var, per zone. `hapi secrets resolve` reads each id with
# `bws secret get <id>` and writes $XDG_RUNTIME_DIR/hapi/<zone>.env (mode
# 0600). It writes nothing unless every key resolves. Full reference:
# docs/secrets.md.
#
# This file holds bws secret IDS, never values. A test checks that every value
# is a UUID. An id is useless without the machine account's access token
# (BWS_ACCESS_TOKEN), which is never written anywhere.
#
# Every id below is a PLACEHOLDER (00000000-0000-0000-0000-...), which
# `hapi secrets resolve` refuses. To fill one in: create the secret in the
# Bitwarden web app under the name in its comment, copy its id from there, and
# replace the placeholder (docs/secrets.md, "Filling in the map"). Where each
# key comes from: docs/runbooks/provider-keys.md, slack.md and github-apps.md.
#
# Comments name each secret's bws key, its name in the vault. MCP keys keep the
# name policy/mcp.yaml gives them (bws:hapi-mcp-<slug>), and their env var is
# that name upper-cased with "-" as "_" (secretEnvName): the generated configs
# read ${HAPI_MCP_<SLUG>}. A test checks that this map fills every reference
# of the MCP servers each zone loads.

# The Hermes container (Hermes main session).
hermes:
  ANTHROPIC_API_KEY: 00000000-0000-0000-0000-000000000101     # hapi-hermes-anthropic-api-key: Console workspace hapi-hermes ($60/month)
  SLACK_BOT_TOKEN: 00000000-0000-0000-0000-000000000102       # hapi-hermes-slack-bot-token: the bot token (xoxb-...)
  SLACK_APP_TOKEN: 00000000-0000-0000-0000-000000000103       # hapi-hermes-slack-app-token: the app-level Socket Mode token (xapp-...)
  SLACK_ALLOWED_USERS: 00000000-0000-0000-0000-000000000104   # hapi-hermes-slack-allowed-users: your Slack member ID, comma-separated if more

# The Archon container. Pi runs in-process, so it sees these too.
archon:
  ANTHROPIC_API_KEY: 00000000-0000-0000-0000-000000000201     # hapi-archon-anthropic-api-key: Console workspace hapi-factory ($100/month); Pi reads this name
  CLAUDE_API_KEY: 00000000-0000-0000-0000-000000000201        # the same secret: Archon's claude nodes read this name
  OPENCODE_API_KEY: 00000000-0000-0000-0000-000000000202      # hapi-archon-opencode-api-key: OpenCode Go, for the portable roster
  HAPI_JEV_OPENROUTER_API_KEY: 00000000-0000-0000-0000-000000000203   # hapi-archon-jev-openrouter-api-key: OpenRouter key hapi-jev ($2/month); not OPENROUTER_API_KEY, so Pi never bills it

# The hapi-research container: spend-capped, search-only keys (spec §10.1).
research:
  BRAVE_SEARCH_API_KEY: 00000000-0000-0000-0000-000000000301  # hapi-research-brave-search-api-key: Hermes's Brave search backend
  EXA_API_KEY: 00000000-0000-0000-0000-000000000302           # hapi-research-exa-api-key: Hermes's Exa contents (extract) backend
  HAPI_MCP_CONTEXT7_API_KEY: 00000000-0000-0000-0000-000000000303   # hapi-mcp-context7-api-key: policy/mcp.yaml's context7 server

# Host tools run by the hapi user: `hapi token mint`, and later the harvester
# and the hapi-gh-token helper. Never a container's env file: the App keys mint
# 1-hour tokens outside the agents (spec §4.3), so no container ever holds one.
host:
  HAPI_PLANNER_APP_ID: 00000000-0000-0000-0000-000000000401   # hapi-host-planner-app-id: the hapi-planner App's App ID
  HAPI_PLANNER_APP_PRIVATE_KEY: 00000000-0000-0000-0000-000000000402   # hapi-host-planner-app-private-key: its private key (PEM)
  HAPI_FACTORY_APP_ID: 00000000-0000-0000-0000-000000000403   # hapi-host-factory-app-id: the hapi-factory App's App ID
  HAPI_FACTORY_APP_PRIVATE_KEY: 00000000-0000-0000-0000-000000000404   # hapi-host-factory-app-private-key: its private key (PEM)
