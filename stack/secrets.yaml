# yaml-language-server: $schema=../policy/schemas/secrets-manifest.schema.json
#
# The secrets manifest (spec §11.5): every secret the stack needs, per zone, as
# env var -> logical name. It is public and provider-neutral: it holds no ids
# and no values. Your local secrets config (outside the repo,
# ~/.config/hapi/secrets.yaml by default) picks the provider, sops + age by
# default, and your store holds each value under its logical name.
#
# This file is the single list of what must exist. `hapi secrets resolve`
# writes $XDG_RUNTIME_DIR/hapi/env/<zone>.env (mode 0600) only when the store
# has every name here with a non-empty value; `hapi secrets check` names any
# that is missing or empty. To add a secret, add its line here in a PR, then
# add `<logical-name>: <value>` to your store (`mise run secrets:edit`).
# Full reference: docs/secrets.md.
#
# Comments say where each value comes from: docs/runbooks/provider-keys.md,
# slack.md and github-apps.md. MCP secrets keep the name policy/mcp.yaml gives
# them (secret:hapi-mcp-<slug>), and their env var is that name upper-cased
# with "-" as "_" (secretEnvName): the generated configs read
# ${HAPI_MCP_<SLUG>}. A test checks that this file maps every reference of the
# MCP servers each zone loads.

# The Hermes container (Hermes main session).
hermes:
  ANTHROPIC_API_KEY: hapi-hermes-anthropic-api-key         # Console workspace hapi-hermes ($60/month)
  SLACK_BOT_TOKEN: hapi-hermes-slack-bot-token             # the bot token (xoxb-...)
  SLACK_APP_TOKEN: hapi-hermes-slack-app-token             # the app-level Socket Mode token (xapp-...)
  SLACK_ALLOWED_USERS: hapi-hermes-slack-allowed-users     # your Slack member ID, comma-separated if more

# The Archon container. Pi runs in-process, so it sees these too.
archon:
  ANTHROPIC_API_KEY: hapi-archon-anthropic-api-key         # Console workspace hapi-factory ($100/month); Pi reads this name
  CLAUDE_API_KEY: hapi-archon-anthropic-api-key            # the same secret: Archon's claude nodes read this name
  OPENCODE_API_KEY: hapi-archon-opencode-api-key           # OpenCode Go, for the portable roster
  HAPI_JEV_OPENROUTER_API_KEY: hapi-archon-jev-openrouter-api-key   # OpenRouter key hapi-jev ($2/month); not OPENROUTER_API_KEY, so Pi never bills it

# The hapi-research container: spend-capped, search-only keys (spec §10.1).
research:
  BRAVE_SEARCH_API_KEY: hapi-research-brave-search-api-key   # Hermes's Brave search backend
  EXA_API_KEY: hapi-research-exa-api-key                     # Hermes's Exa contents (extract) backend
  HAPI_MCP_CONTEXT7_API_KEY: hapi-mcp-context7-api-key       # policy/mcp.yaml's context7 server

# Host tools run by the hapi user: `hapi token mint`, and later the harvester
# and the hapi-gh-token helper. Never a container's env file: the App keys mint
# 1-hour tokens outside the agents (spec §4.3), so no container ever holds one.
host:
  HAPI_PLANNER_APP_ID: hapi-host-planner-app-id                     # the hapi-planner App's App ID
  HAPI_PLANNER_APP_PRIVATE_KEY: hapi-host-planner-app-private-key   # its private key (PEM)
  HAPI_FACTORY_APP_ID: hapi-host-factory-app-id                     # the hapi-factory App's App ID
  HAPI_FACTORY_APP_PRIVATE_KEY: hapi-host-factory-app-private-key   # its private key (PEM)
